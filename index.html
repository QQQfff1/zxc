<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>多人公共聊天室</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui;
    }

    body {
      background: #f5f5f5;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .room {
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 85vh;
    }

    .header {
      background: #2d7dff;
      color: white;
      padding: 16px;
      font-weight: bold;
      font-size: 16px;
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f9f9f9;
    }

    .msg {
      margin-bottom: 12px;
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.4;
    }

    .msg.other {
      background: white;
      border: 1px solid #eee;
      align-self: flex-start;
    }

    .msg.me {
      background: #2d7dff;
      color: white;
      align-self: flex-end;
      margin-left: auto;
    }

    .name {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
    }

    .msg img, .msg video {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 6px;
    }

    .footer {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid #eee;
    }

    #msgInput {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      outline: none;
    }

    button {
      padding: 12px 18px;
      background: #2d7dff;
      color: white;
      border: none;
      border-radius: 24px;
      cursor: pointer;
    }

    #fileInput {
      display: none;
    }

    .messages {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>

<body>
<div class="room">
  <div class="header">公共聊天室 - 所有人一起聊天</div>
  <div class="messages" id="msgBox"></div>

  <div class="footer">
    <button onclick="document.getElementById('fileInput').click()">📎 发文件</button>
    <input type="file" id="fileInput" accept="image/*,video/*">
    <input type="text" id="msgInput" placeholder="输入消息...">
    <button onclick="send()">发送</button>
  </div>
</div>

<script>
  // 随机用户名
  const username = '用户' + Math.floor(Math.random() * 10000);

  // 连接WebSocket
  const ws = new WebSocket('ws://localhost:3000');

  // 发送文字
  function send() {
    const text = msgInput.value.trim();
    if (!text) return;

    const data = {
      type: 'text',
      user: username,
      content: text
    };

    ws.send(JSON.stringify(data));
    msgInput.value = '';
  }

  // 发送图片/视频
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    if (!file) return;

    const form = new FormData();
    form.append('file', file);

    const res = await fetch('http://localhost:3000/upload', {
      method: 'POST',
      body: form
    });

    const { url } = await res.json();

    const data = {
      type: file.type.startsWith('image') ? 'image' : 'video',
      user: username,
      content: url
    };

    ws.send(JSON.stringify(data));
  };

  // 接收消息
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    const isMe = data.user === username;

    const div = document.createElement('div');
    div.className = `msg ${isMe ? 'me' : 'other'}`;

    let html = `<div class="name">${data.user}</div>`;

    if (data.type === 'text') {
      html += data.content;
    } else if (data.type === 'image') {
      html += `<img src="${data.content}">`;
    } else if (data.type === 'video') {
      html += `<video src="${data.content}" controls></video>`;
    }

    div.innerHTML = html;
    msgBox.appendChild(div);
    msgBox.scrollTop = msgBox.scrollHeight;
  };

  // 回车发送
  msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') send();
  });
</script>
</body>
</html>
